line-length = 125
indent-width = 4
target-version = "py313"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = []

exclude = [
    "rando/gui/src/patcher_ui.py", # this is generated
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
