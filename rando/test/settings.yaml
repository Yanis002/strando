settings:
    shuffle:
        # 0-5 items, 0 will disable the option (vanilla: 0)
        shop_sanity: 5

        # true/false (vanilla: false)
        rupee_sanity: true

        # - remove (disables passenger quests)
        # - vanilla (default start location, gives item when reached destination)
        # - abstract (no transport, same as above but the NPC is an item at pick up location)
        # - anywhere (same as above but both pick up and destination items are shuffled)
        passengers: "abstract"

        # - remove (disables cargo quests)
        # - vanilla (default start location, only gives item at destination npc)
        # - abstract (same as vanilla except you can carry multiple things at the same time with an unlimited amount)
        # - anywhere (same as above except picking up cargo also gives an item and cargo kinds are items too)
        cargo: "abstract"

        # - vanilla
        # - anywhere (not progressive)
        # - prog_realm (forest glyph -> forest source, snow glyph -> snow source, ...)
        # - prog_world (forest glyph -> forest source -> snow glyph -> snow source -> ...)
        glyphs_and_sources: "anywhere"

        # - startwith (allowing train rides in forest realm)
        # - anywhere (only allowing travel between outset village and castle town when in forest realm)
        forest_glyph: "startwith"

        # true/false
        duets: true

        # to disable a difficulty level reward or simply disabling the check, change the list
        minigames:
            sword_training: ['on']
            whip_race: ['easy', 'hard', 'expert']
            goron_range: ['on']
            pirate_hideout: ['easy', 'hard', 'expert']
            take_em_all_on: ['easy', 'hard', 'expert']

        # true/false (will add stamps as items and monuments will be a location)
        stamps: true

        # shuffle 10, 15 or 20 stamps rewards from Niko
        stamps_rewards: [10, 15, 20]

        # true/false (shuffles the stamp book)
        stamp_book: true

        # shuffle rabbits, catching rabbits will be a location
        # list of:
        # - "grass"
        # - "snow"
        # - "water"
        # - "fire"
        # - "sand"
        # - "all" - note that this will shuffle all 5 types of rabbits (for convenience)
        # to disable the shuffle you need to use "none" or make the list empty
        rabbit_sanity: ["all"]

        # true/false (will give all 10 rabbits of the realm when enabled)
        rabbit_pack: false

    shuffle_dungeon:
        # off, section (tears only), dungeon, anywhere, removed
        key_sanity: "anywhere" # (vanilla: off)
        bosskey_sanity: "off" # (vanilla: off)
        tear_sanity: "anywhere" # (vanilla: off)

        # true/false
        key_ring: false # (vanilla: false)
        bosskey_ring: false # same as `key_ring` but include boss keys (vanilla: false)
        tear_ring: false # (vanilla: false)

        # - open (all sections are available)
        # - open_no_6 (same as above except section 6 requires the bow of light to open it)
        # - progressive (adds "tower section" items)
        # - sources (vanilla behavior)
        tos_sections: false

        # true/false (vanilla: false)
        tos_section_reward: true

    goal:
        # open, dungeons, compass, restoration_songs (vanilla: compass)
        unlock_dark_realm: "dungeons"

        # 1-5, only relevant when choosing `dungeons` for `dark_realm`
        dungeon_amount: 5
